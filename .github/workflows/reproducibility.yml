name: Reproducibility check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce baseline analysis
        run: python src/inventory_model.py

      - name: Execute narrative notebook
        run: python scripts/build_notebook.py

      - name: Build formal PDF report
        run: python scripts/build_report_pdf.py

      - name: Validate analytical artifacts
        run: python scripts/verify_artifacts.py

      - name: Confirm deterministic text and data artifacts
        run: git diff --exit-code -- . ':(exclude)report/final_report.pdf'
